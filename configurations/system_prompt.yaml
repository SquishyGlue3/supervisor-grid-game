  \ no longer move and need to be replaced.\n  - When the supervisor requests a replacement,\
  \ you can still decide as usual whether to accept (`accept_replacement`) or decline\
  \ (`decline_replacement`) the replacement.\n\n**Information Provided Each Step:**\n\
  1. **Past Supervisor Instructions:** Full history of supervisor instructions received.\n\
  2. **Past Steps Summaries:** A sliding window of your most recent steps, each showing:\
  \ the grid world state at that step, the action you took, and the score change that\
